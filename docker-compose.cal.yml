# Docker Compose for Cal.com (Self-Hosted Scheduling Engine)
# Run with: docker compose -f docker-compose.cal.yml up -d
services:
  calcom:
    image: calcom/cal.com:latest
    container_name: cal_diy_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://calcom:calcom_secret@calcom-postgres:5432/calcom
      - DATABASE_DIRECT_URL=postgresql://calcom:calcom_secret@calcom-postgres:5432/calcom
      - NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000
      - NEXTAUTH_SECRET=cybells_super_secret_nextauth_cal_key_998877
      - CALENDSO_ENCRYPTION_KEY=12345678901234567890123456789012
      - CAL_WEBHOOK_SECRET=cal_webhook_secret_cybells_2026
    depends_on:
      calcom-postgres:
        condition: service_healthy
    networks:
      - sales_network

  calcom-postgres:
    image: postgres:16-alpine
    container_name: cal_diy_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=calcom
      - POSTGRES_PASSWORD=calcom_secret
      - POSTGRES_DB=calcom
    volumes:
      - calcom_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcom -d calcom"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sales_network

volumes:
  calcom_pg_data:

networks:
  sales_network:
    name: sales_network
    driver: bridge
